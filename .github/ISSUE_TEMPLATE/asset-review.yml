name: "🦊 品牌/IP资产审核"
description: "官方资产入库、授权与一致性检查"
title: "[资产审核] "
body:
  - type: textarea
    id: item
    attributes:
      label: "资产名称/版本与来源"
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: "授权范围与使用限制"
      description: "公开展示？商业印刷？网页？是否可改造？"
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: "需验证的问题"
      description: "颜色数值、Logo细节、角色形象、是否为最终确认稿"
