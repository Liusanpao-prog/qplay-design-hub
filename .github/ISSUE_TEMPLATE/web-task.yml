name: "💻 网页开发任务"
description: "官网/数字品牌手册功能与视觉修改"
title: "[网页] "
body:
  - type: textarea
    id: page
    attributes:
      label: "页面与目的"
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: "内容、交互与响应式要求"
